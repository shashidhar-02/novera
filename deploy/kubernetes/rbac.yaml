apiVersion: v1
kind: ServiceAccount
metadata:
  name: astra-scheduler
  namespace: astra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astra-scheduler-cluster
rules:
  # Node inspection for capacity and topology
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Pod binding and scheduling status
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  # Custom ASTRA workload profiles
  - apiGroups: ["astra.io"]
    resources: ["workloadprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astra-scheduler-cluster-binding
subjects:
  - kind: ServiceAccount
    name: astra-scheduler
    namespace: astra-system
roleRef:
  kind: ClusterRole
  name: astra-scheduler-cluster
  apiGroup: rbac.authorization.k8s.io
---
# Namespace-scoped coordination leases
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astra-leader-election
  namespace: astra-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astra-leader-election-binding
  namespace: astra-system
subjects:
  - kind: ServiceAccount
    name: astra-scheduler
    namespace: astra-system
roleRef:
  kind: Role
  name: astra-leader-election
  apiGroup: rbac.authorization.k8s.io
