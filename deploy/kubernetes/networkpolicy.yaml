apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: astra-default-deny-all
  namespace: astra-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: astra-scheduler-netpol
  namespace: astra-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: astra-scheduler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health probe and Prometheus scrape
    - ports:
        - protocol: TCP
          port: 10259
        - protocol: TCP
          port: 8080
  egress:
    # Allow CoreDNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to Kubernetes API server
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

