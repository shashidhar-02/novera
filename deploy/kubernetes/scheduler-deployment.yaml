apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-scheduler
  namespace: astra-system
  labels:
    app.kubernetes.io/name: astra-scheduler
    app.kubernetes.io/part-of: astra
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: astra-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astra-scheduler
        app.kubernetes.io/part-of: astra
    spec:
      serviceAccountName: astra-scheduler
      # Hardened Pod Security Standards: Restricted
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: astra-scheduler
          image: ghcr.io/shashidhar-02/novera/scheduler:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 10259
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

