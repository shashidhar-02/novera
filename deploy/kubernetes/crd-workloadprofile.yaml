apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloadprofiles.astra.io
spec:
  group: astra.io
  names:
    kind: WorkloadProfile
    listKind: WorkloadProfileList
    plural: workloadprofiles
    singular: workloadprofile
    shortNames:
      - wp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - class
              properties:
                class:
                  type: string
                  enum:
                    - LatencySensitive
                    - ThroughputBatch
                    - IOIntensive
                targetP99Ms:
                  type: number
                  minimum: 0.1
                maxAllowedJitterMs:
                  type: number
                  minimum: 0.0
                interferenceSensitivity:
                  type: string
                  enum:
                    - High
                    - Medium
                    - Low
      subresources:
        status: {}

