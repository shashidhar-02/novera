name: CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Unit, Concurrency & Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Verify Go Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly:"
            gofmt -d .
            exit 1
          fi

      - name: Vet All Packages
        run: go vet ./...

      - name: Run Go Unit & Concurrency Tests with Race Detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Build All ASTRA Binaries
        run: |
          go build -v -o bin/astra ./cmd/astra
          go build -v -o bin/astra-scheduler ./cmd/astra-scheduler
          go build -v -o bin/astra-agent ./cmd/astra-agent
          go build -v -o bin/simulator ./cmd/simulator

      - name: Test Operator CLI
        run: |
          ./bin/astra status
          ./bin/astra node status
          ./bin/astra scheduler status
          ./bin/astra decision explain
          ./bin/astra policy validate
          ./bin/astra debug bundle

      - name: Run Deterministic Simulator Benchmark Smoke
        run: ./bin/simulator --seed 42 --nodes 6 --workloads 40

      - name: Run Mathematical Dual-Engine Model Cross-Check
        run: python scripts/verify_model.py

      - name: Run Multi-Seed Benchmark Suite
        run: python benchmark/runner.py

      - name: Upload Test Coverage
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: coverage-report
          path: ./coverage.txt
