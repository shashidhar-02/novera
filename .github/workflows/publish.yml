name: Publish Containers & Release Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-images:
    name: Build & Push Multi-Arch Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowecase Image Prefix & Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_PREFIX=ghcr.io/${REPO_LOWER}" >> "$GITHUB_ENV"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "PRIMARY_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PRIMARY_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build and Push Scheduler Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: deploy/docker/Dockerfile.scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO_PREFIX }}/scheduler:${{ env.PRIMARY_TAG }}
            ${{ env.REPO_PREFIX }}/scheduler:latest

      - name: Build and Push Node Agent Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO_PREFIX }}/agent:${{ env.PRIMARY_TAG }}
            ${{ env.REPO_PREFIX }}/agent:latest

      - name: Build and Push Operator CLI Image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: deploy/docker/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO_PREFIX }}/cli:${{ env.PRIMARY_TAG }}
            ${{ env.REPO_PREFIX }}/cli:latest
            ${{ env.REPO_PREFIX }}:latest

  build-binaries:
    name: Cross-Compile Binaries & Generate Checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - name: Cross-Compile Multi-Platform Binaries
        run: |
          mkdir -p dist
          PLATFORMS=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")
          BINARIES=("astra" "astra-scheduler" "astra-agent" "simulator")
          
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="v0.1.0"
          fi

          for PLATFORM in "${PLATFORMS[@]}"; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            EXT=""
            if [ "$OS" == "windows" ]; then
              EXT=".exe"
            fi
            
            STAGE_DIR="dist/novera_${VERSION}_${OS}_${ARCH}"
            mkdir -p "$STAGE_DIR"
            
            for BIN in "${BINARIES[@]}"; do
              echo "Compiling $BIN for $OS/$ARCH..."
              CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$STAGE_DIR/${BIN}${EXT}" "./cmd/$BIN"
            done
            
            # Package archive
            cd dist
            if [ "$OS" == "windows" ]; then
              zip -r "novera_${VERSION}_${OS}_${ARCH}.zip" "novera_${VERSION}_${OS}_${ARCH}"
            else
              tar -czvf "novera_${VERSION}_${OS}_${ARCH}.tar.gz" "novera_${VERSION}_${OS}_${ARCH}"
            fi
            rm -rf "novera_${VERSION}_${OS}_${ARCH}"
            cd ..
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum ./* > sha256sum.txt
          cat sha256sum.txt
          cd ..

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-binaries
          path: ./dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: ./dist/*
          generate_release_notes: true
          name: Novera Release ${{ github.ref_name }}
          draft: false
          prerelease: false
